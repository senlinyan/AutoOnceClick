name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.9'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "No keystore found in secrets, skipping release build"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f keystore.jks ]; then
            gradle assembleRelease --stacktrace
          else
            echo "No keystore, building debug only"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success() && hashFiles('app/build/outputs/apk/release/*.apk') != ''
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/*.apk
