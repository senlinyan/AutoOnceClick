name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.9'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias autoonceclick -storepass AutoOnceClick2024! -keypass AutoOnceClick2024! -dname "CN=AutoOnceClick, OU=Dev, O=AutoOnceClick, L=Beijing, ST=Beijing, C=CN"

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: AutoOnceClick2024!
          KEY_ALIAS: autoonceclick
          KEY_PASSWORD: AutoOnceClick2024!
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/*.apk
